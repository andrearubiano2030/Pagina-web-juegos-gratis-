<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCADE ZONE // Mini-Juegos</title>
    <style>
        :root {
            --bg-dark: #0a0a12;
            --bg-card: #131322;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff007f;
            --neon-purple: #9d00ff;
            --neon-green: #00ff66;
            --text-main: #e0e0f0;
            --text-muted: #8a8aa8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(157, 0, 255, 0.12), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 243, 255, 0.12), transparent 25%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 25px var(--neon-cyan);
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* MENÚ DE NAVEGACIÓN */
        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 30px;
        }

        .nav-btn {
            background: var(--bg-card);
            color: var(--text-main);
            border: 2px solid #2a2a45;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
            transform: translateY(-2px);
        }

        .nav-btn.active {
            background: rgba(0, 243, 255, 0.15);
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        /* CONTENEDOR DE JUEGOS */
        main {
            width: 100%;
            max-width: 650px;
            background: var(--bg-card);
            border: 1px solid #2a2a45;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .game-section {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: fadeIn 0.3s ease;
        }

        .game-section.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--neon-pink);
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        /* BOTONES GENERALES */
        .action-btn {
            background: linear-gradient(45deg, var(--neon-purple), var(--neon-pink));
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            transition: 0.2s;
            margin-top: 15px;
        }

        .action-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 22px rgba(255, 0, 127, 0.8);
        }

        /* ================= JUEGO 1: PIEDRA PAPEL O TIJERA ================= */
        .scoreboard {
            display: flex;
            gap: 40px;
            background: #0d0d18;
            padding: 15px 35px;
            border-radius: 10px;
            border: 1px solid #25253d;
            margin-bottom: 25px;
        }

        .score-box span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .score-box strong {
            font-size: 2rem;
            color: var(--neon-cyan);
        }

        .ppt-choices {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
        }

        .choice-btn {
            background: #1b1b30;
            border: 2px solid #323254;
            border-radius: 14px;
            width: 105px;
            height: 105px;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .choice-btn span {
            font-size: 0.8rem;
            color: var(--text-main);
            margin-top: 5px;
            font-weight: bold;
        }

        .choice-btn:hover {
            border-color: var(--neon-pink);
            box-shadow: 0 0 18px rgba(255, 0, 127, 0.5);
            transform: translateY(-5px);
        }

        .ppt-result {
            min-height: 75px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        #ppt-status {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        #ppt-detail {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ================= JUEGO 2: ADIVINA EL NÚMERO ================= */
        .guess-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            background: #0d0d18;
            border: 2px solid var(--neon-cyan);
            color: white;
            font-size: 1.5rem;
            width: 130px;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }

        .guess-box .action-btn {
            margin-top: 0;
        }

        #guess-feedback {
            font-size: 1.2rem;
            font-weight: bold;
            min-height: 35px;
            margin-bottom: 10px;
        }

        #guess-attempts {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* ================= JUEGO 3: MEMORAMA ================= */
        .memo-stats {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-size: 1rem;
            color: var(--neon-cyan);
            font-weight: bold;
        }

        .memo-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
        }

        .memo-card {
            aspect-ratio: 1;
            background: #1c1c34;
            border: 2px solid var(--neon-purple);
            border-radius: 10px;
            font-size: 2.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            user-select: none;
        }

        .memo-card:hover:not(.flipped):not(.matched) {
            box-shadow: 0 0 12px var(--neon-purple);
            transform: scale(1.04);
        }

        .memo-card.flipped {
            background: #272747;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.5);
        }

        .memo-card.matched {
            background: rgba(0, 255, 102, 0.15);
            border-color: var(--neon-green);
            box-shadow: 0 0 12px rgba(0, 255, 102, 0.4);
            cursor: default;
        }

        .memo-card span {
            display: none;
        }

        .memo-card.flipped span,
        .memo-card.matched span {
            display: block;
        }

        .memo-card::after {
            content: "?";
            color: var(--neon-purple);
            font-weight: bold;
            font-size: 1.8rem;
        }

        .memo-card.flipped::after,
        .memo-card.matched::after {
            display: none;
        }

        @media (max-width: 500px) {
            h1 { font-size: 2rem; }
            .ppt-choices { gap: 10px; }
            .choice-btn { width: 90px; height: 90px; font-size: 2.4rem; }
            .memo-grid { gap: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>ARCADE ZONE</h1>
        <p>Selecciona un juego y supera tu récord</p>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchGame('ppt', this)">✊ Piedra Papel Tijera</button>
        <button class="nav-btn" onclick="switchGame('guess', this)">🔢 Adivina el Número</button>
        <button class="nav-btn" onclick="switchGame('memo', this)">🧠 Memorama</button>
    </nav>

    <main>
        <!-- JUEGO 1: PIEDRA PAPEL O TIJERA -->
        <section id="game-ppt" class="game-section active">
